name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  snapshot-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify CODE_SNAPSHOT matches HEAD + contract
        run: python3 scripts/update_code_snapshot.py verify

      - name: Generate + validate evidence fixture
        run: |
          python3 scripts/build_evidence.py generate -o artifacts/evidence.json
          python3 scripts/build_evidence.py validate artifacts/evidence.json

      - name: Unit tests
        run: python3 -m pytest -q

      - name: Contract source present
        run: test -f contracts/DealGuard.py && wc -l contracts/DealGuard.py

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
