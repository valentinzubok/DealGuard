name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  snapshot-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify CODE_SNAPSHOT matches contract file hashes
        run: python3 scripts/update_code_snapshot.py verify

      - name: Validate CODE_SNAPSHOT + condition_met schemas
        run: |
          # CODE_SNAPSHOT.json ↔ schemas/code_snapshot.schema.json
          # templates/deal_evidence.json example ↔ schemas/condition_met.schema.json
          python3 scripts/validate_schemas.py

      - name: Generate + validate evidence fixture (condition_met)
        run: |
          python3 scripts/build_evidence.py generate -o artifacts/evidence.json
          python3 scripts/build_evidence.py validate artifacts/evidence.json

      - name: Build integrity pack artifact
        run: python3 scripts/generate_integrity_pack.py

      - name: Unit tests (create_deal, fund, submit_delivery, dispute, …)
        run: python3 -m pytest -q

      - name: Upload integrity pack
        uses: actions/upload-artifact@v4
        with:
          name: dealguard-integrity-pack
          path: artifacts/integrity-pack.json

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
